name: One-time merged-branch cleanup

on:
  push:
    branches:
      - feat/live-voice-rvc-prototype
    paths:
      - ".github/workflows/merged-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  delete-merged-mic-effects:
    if: "${{ github.event.head_commit.message == 'chore: delete merged Mic Effects branch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete merged branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/feat/live-voice-mic-effects"
