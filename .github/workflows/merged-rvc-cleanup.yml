name: One-time merged RVC branch cleanup

on:
  push:
    branches:
      - feat/live-voice-qa
    paths:
      - ".github/workflows/merged-rvc-cleanup.yml"

permissions:
  contents: write

jobs:
  delete-merged-rvc:
    if: "${{ github.event.head_commit.message == 'chore: delete merged RVC prototype branch' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete merged RVC prototype branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/feat/live-voice-rvc-prototype"
